    <div class="site-content">
      <div class="container-content">
        <main id="main" class="content-area">
          <h1>お問い合わせ</h1>
          <p class="inquiry__hint">お急ぎの方は、お電話 <a href="tel:0485119141">048-511-9141</a> もご利用ください。</p>

          <!--
            本番: Netlify では data-netlify="true" のフォームをビルド時に検出。別ホストでは Formspree / FormSubmit 等の action URL に差し替え、
            または WordPress へ移行のうえ Contact Form 7 を使用してください（公式: https://oyakoko-onigiri.com/faq/）
          -->
          <form
            class="inquiry-form"
            name="inquiry"
            method="post"
            action="faq.html"
            data-netlify="true"
            data-netlify-honeypot="bot-field"
          >
            <input type="hidden" name="form-name" value="inquiry" />
            <p class="n-form-hidden">
              <label>この欄は空のままにしてください: <input name="bot-field" type="text" autocomplete="off" /></label>
            </p>
            <p>
              <label for="inquiry-name">氏名 <span class="inquiry__req" aria-label="必須">（必須）</span></label>
              <input id="inquiry-name" name="name" type="text" required autocomplete="name" />
            </p>
            <p>
              <label for="inquiry-email">メールアドレス <span class="inquiry__req" aria-label="必須">（必須）</span></label>
              <input
                id="inquiry-email"
                name="email"
                type="email"
                required
                autocomplete="email"
                inputmode="email"
              />
            </p>
            <p>
              <label for="inquiry-subject">題名 <span class="inquiry__req" aria-label="必須">（必須）</span></label>
              <input id="inquiry-subject" name="subject" type="text" required />
            </p>
            <p>
              <label for="inquiry-body">メッセージ本文（任意）</label>
              <textarea id="inquiry-body" name="message" rows="6"></textarea>
            </p>
            <p>
              <button class="inquiry__submit" type="submit">送信</button>
            </p>
            <p class="inquiry__hint">送信の受信先は、公開するホスティング（例: Netlify フォーム、Formspree 等）で設定が必要です。手元のローカル表示だけでは送れないこともあります。お急ぎは上記お電話にて。</p>
          </form>
        </main>
      </div>
    </div>
