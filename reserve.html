  </head>
  <body class="reserve-body">

            お会計は来店時に店頭でお願いします。<br />
            おにぎりは1つの価格です。
          </p>
          <!-- お弁当一時中止

          <div id="reserve-menu-root"></div>
        </main>
      </div>
    </div>

    <div class="reserve-fab" id="reserve-fab">
      <button
        type="button"
        class="reserve-fab__btn"
        id="reserve-fab-open"
        aria-expanded="false"
        aria-controls="reserve-sheet"
      >
        <i class="fa fa-shopping-cart" aria-hidden="true"></i>
        <span class="reserve-fab__count" id="fab-count">0</span>
        <span class="reserve-fab__total" id="fab-total">¥0</span>
        <span class="reserve-fab__label">カートを見る</span>
      </button>
    </div>

    <div class="reserve-sheet-backdrop" id="sheet-backdrop" aria-hidden="true"></div>
    <div class="reserve-sheet" id="reserve-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheet-title">
      <div class="reserve-sheet__handle" aria-hidden="true"></div>
      <div class="reserve-sheet__inner">
      <button type="button" class="reserve-sheet__close" id="sheet-close" aria-label="カートを閉じる">×</button>
      <div class="reserve-sheet__head">
        <h2 id="sheet-title">カート内の商品</h2>
        <button type="button" class="reserve-cart-clear" id="cart-clear" hidden aria-label="カート内の商品をすべて削除">
          <i class="fa fa-trash-o" aria-hidden="true"></i> 全て削除
        </button>
      </div>
      <p class="reserve-empty" id="cart-empty">カートに商品がありません。メニューから数量をお選びください。</p>
      <h3 class="reserve-cart__heading" id="cart-heading" hidden>注文内容の確認</h3>
      <ul
        class="reserve-cart-lines"
        id="cart-lines"
        aria-label="注文商品一覧"
        aria-live="polite"
      ></ul>
      <div class="reserve-sheet__subtotal" id="cart-subtotal-wrap" hidden>
        <span>小計<span class="reserve-sheet__subtotal-count" id="cart-subtotal-count"></span></span>
        <span id="cart-subtotal">¥0</span>
      </div>
      <form
        class="reserve-form"
        id="reserve-form"
        name="reservation"
        method="post"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
        action="/reserve"
      >
        <input type="hidden" name="form-name" value="reservation" />
        <p class="n-form-hidden">
          <label>この欄は空: <input name="bot-field" type="text" autocomplete="off" /></label>
        </p>
        <input type="hidden" name="order_lines" id="order_lines" value="" />
        <h3 class="reserve-form__h">受取・お客様情報</h3>
        <p>
          <label for="r-name">お名前 <span class="req" aria-label="必須">＊</span></label>
          <input type="text" name="customer_name" id="r-name" required autocomplete="name" />
        </p>
        <p>
          <label for="r-tel">お電話番号 (任意)
             <!-- <span class="req" aria-label="必須">＊</span> -->
            </label>
          <input type="tel" name="customer_tel" id="r-tel"  autocomplete="tel" inputmode="tel" />
        </p>
        <p>
          <label for="r-date">受取希望日 <span class="req" aria-label="必須">＊</span></label>
          <select name="pickup_date" id="r-date" required aria-describedby="r-date-hint"></select>
          <span class="reserve-date-hint" id="r-date-hint">平日 10:00〜 土日祝 7:00〜 水曜：定休日</span>
        </p>
        <fieldset class="reserve-form__fieldset">
          <legend>受取希望時間 <span class="req" aria-label="必須">＊</span></legend>
          <div class="reserve-time-row" role="group" aria-label="受取希望の時刻（5分刻み）">
            <div class="reserve-time__field">
              <label for="r-hour">時</label>
              <select name="pickup_hour" id="r-hour" required autocomplete="off">
                <option value="">選択</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <!-- <option value="18">18</option> -->
              </select>
            </div>
            <div class="reserve-time__field">
              <label for="r-min">分</label>
              <select name="pickup_min" id="r-min" required autocomplete="off">
                <option value="">選択</option>
                <option value="00">00</option>
                <option value="05">05</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="25">25</option>
                <option value="30">30</option>
                <option value="35">35</option>
                <option value="40">40</option>
                <option value="45">45</option>
                <option value="50">50</option>
                <option value="55">55</option>
              </select>
            </div>
          </div>
          <p class="reserve-time-hint">原則お受け取りの30分前までのご予約お願いします！</p>
        </fieldset>
        <p>
          <label for="r-note">ご要望・メモ（任意）</label>
          <textarea name="note" id="r-note" rows="3"></textarea>
        </p>
        <p class="reserve-form__note">
          内容は目安です。在庫・混雑によりご希望に沿えない場合、担当よりご連絡する場合がございます。送信前にカートの品目数をご確認ください。
        </p>
        <button type="submit" class="reserve-form__submit" id="reserve-submit" disabled>予約内容を送信</button>
      </form>
      </div>
    </div>

    <footer class="site-bottom">
      <div class="site-bottom-content">
        <p>© 2026 親孝行おにぎり</p>
      </div>

    <script src="js/reserve.js?v=20251009f" defer></script>
    <script src="js/liff-env.js?v=20250904" defer></script>
    <script src="js/liff-core.js?v=20251009" defer></script>
    <script src="js/liff-message.js?v=20250904" defer></script>
    <script src="js/liff.js?v=20250911" defer></script>


  </body>
</html>
