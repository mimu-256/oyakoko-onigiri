<!DOCTYPE html>
<html lang="ja" class="reserve-page">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>お知らせ｜豚汁のご予約</title>
    <meta name="description" content="豚汁をモバイルオーダーでご予約いただけます。" />
    <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="css/reserve.css?v=20251107news1" />
  </head>
  <body class="line-entry-body news-page-body">
    <div class="news-liff-gate" id="news-liff-gate" role="status" aria-live="polite">
      <img class="line-entry__logo" src="images/logo.jpg" alt="" width="72" height="72" decoding="async" />
      <p class="news-liff-gate__msg" id="news-liff-gate-msg">読み込んでいます…</p>
    </div>
    <main class="news-page" id="news-liff-content" hidden aria-hidden="true">
      <a class="news-page__logo-link" href="/line-entry/reserve" aria-label="予約ページへ">
        <img class="line-entry__logo" src="images/logo.jpg" alt="親孝行おにぎり" width="72" height="72" />
      </a>
      <p class="news-page__kicker">お知らせ</p>
      <h1 class="news-page__title">豚汁</h1>

      <p class="news-page__thanks">
        いつも親孝行おにぎりをご利用いただきありがとうございます。
      </p>

      <div class="news-page__photos">
        <figure class="news-page__figure">
          <img
            src="images/menu/豚汁.jpg"
            alt="豚汁"
            width="320"
            height="240"
            decoding="async"
            fetchpriority="high"
          />
          <figcaption class="news-page__caption">豚汁 290円（税込）</figcaption>
        </figure>
      </div>

      <div class="news-page__body">
        <p>モバイルオーダーからご予約いただけます。</p>
      </div>

      <p class="news-page__actions">
        <a class="reserve-form__submit news-page__cta" href="/line-entry/reserve?item=m021">さっそく注文する</a>
      </p>
    </main>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="js/liff-env.js?v=20251026news14"></script>
    <script src="js/liff-core.js?v=20251107c"></script>
    <script src="js/liff-page-bootstrap.js?v=20251026news15"></script>
  </body>
</html>
